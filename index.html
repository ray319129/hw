<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 程式練習助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 標題與簡介 -->
        <h1 class="main-title">AI 程式練習助手</h1>
        <p class="subtitle">這是一個用於練習程式設計的 AI 助手。請在下方輸入您的程式碼，並點擊「執行」按鈕來查看結果。</p>
        
        <!-- 主題選擇區 -->
        <p class="section-title">請輸入選擇的學習主題：</p>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="topic" value="io">
                <span class="custom-radio"></span>
                輸入輸出
            </label>
            <label class="radio-label">
                <input type="radio" name="topic" value="condition">
                <span class="custom-radio"></span>
                條件判斷
            </label>
            <label class="radio-label">
                <input type="radio" name="topic" value="loop">
                <span class="custom-radio"></span>
                迴圈
            </label>
            <label class="radio-label">
                <input type="radio" name="topic" value="list">
                <span class="custom-radio"></span>
                串列
            </label>
        </div>

        <!-- 動作按鈕 -->
        <button class="action-btn">幫我出題</button>

        <!-- AI 出題區塊 -->
        <div class="info-block">
            <h2 class="block-title">AI 出題：</h2>
            <p class="block-content">請選擇一個主題，然後點擊「幫我出題」按鈕，AI 將會為您生成一個練習題目。</p>
        </div>

        <!-- AI 回饋區塊 -->
        <div class="info-block">
            <h2 class="block-title">AI 回饋：</h2>
            <p class="block-content">請在下方輸入您的程式碼，然後點擊「執行」按鈕，AI 將會為您提供回饋和建議。</p>
        </div>
    </div>

</body>
</html>
